<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reflexionskarten - Vergangenheit, Gegenwart, Zukunft</title>
    <style>
      :root {
        --ink: #16202a;
        --muted: #5c6875;
        --paper: #fbfaf7;
        --line: rgba(22, 32, 42, 0.16);
        --panel: rgba(255, 255, 255, 0.78);
        --blue: #c9def7;
        --blue-strong: #3d73b9;
        --yellow: #ffe7a5;
        --yellow-strong: #b97912;
        --green: #cfe8cf;
        --green-strong: #3d8247;
        --shadow: 0 22px 55px rgba(18, 28, 38, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--ink);
        background:
          linear-gradient(120deg, rgba(61, 115, 185, 0.12), transparent 32%),
          linear-gradient(235deg, rgba(61, 130, 71, 0.13), transparent 38%),
          var(--paper);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button {
        font: inherit;
      }

      .app {
        height: 100%;
        display: grid;
        grid-template-rows: 1fr auto;
      }

      .slides {
        position: relative;
        min-height: 0;
      }

      .slide {
        position: absolute;
        inset: 0;
        display: none;
        padding: clamp(22px, 3.8vw, 62px);
      }

      .slide.active {
        display: grid;
        align-items: center;
      }

      .slide-inner {
        width: min(1180px, 100%);
        max-height: 100%;
        margin: 0 auto;
      }

      .slide.center .slide-inner {
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: clamp(0.95rem, 1.3vw, 1.35rem);
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 24px;
        font-size: clamp(3rem, 7.4vw, 7.2rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      h2 {
        margin-bottom: 24px;
        font-size: clamp(2.35rem, 5.2vw, 5.1rem);
        line-height: 1.02;
        letter-spacing: 0;
      }

      h3 {
        margin-bottom: 10px;
        font-size: clamp(1.35rem, 2.4vw, 2.25rem);
        line-height: 1.1;
      }

      .lead {
        max-width: 920px;
        margin-right: auto;
        margin-left: auto;
        color: var(--muted);
        font-size: clamp(1.28rem, 2.25vw, 2.1rem);
        line-height: 1.35;
      }

      .color-grid,
      .overview-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(14px, 2vw, 24px);
      }

      .color-card,
      .mini-card,
      .reflection-card,
      .notes-panel,
      .overview-note {
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
      }

      .color-card {
        min-height: 250px;
        padding: clamp(22px, 3vw, 34px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .color-card strong {
        font-size: clamp(1.5rem, 2.8vw, 2.55rem);
      }

      .color-card span {
        color: var(--muted);
        font-size: clamp(1.05rem, 1.7vw, 1.5rem);
        line-height: 1.35;
      }

      .blue {
        background: var(--blue);
      }

      .yellow {
        background: var(--yellow);
      }

      .green {
        background: var(--green);
      }

      .overview-layout {
        display: block;
      }

      .overview-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .mini-card {
        min-width: 0;
        min-height: clamp(90px, 13vh, 112px);
        padding: clamp(14px, 1.7vw, 18px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .mini-card small,
      .reflection-card small,
      .overview-note small {
        color: var(--muted);
        font-size: 0.98rem;
        font-weight: 800;
        overflow-wrap: anywhere;
        text-transform: uppercase;
      }

      .mini-card strong {
        margin-top: 8px;
        font-size: clamp(0.98rem, 1.28vw, 1.28rem);
        line-height: 1.18;
        overflow-wrap: anywhere;
      }

      .overview-note {
        display: none;
      }

      .overview-note p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: clamp(0.98rem, 1.25vw, 1.18rem);
        line-height: 1.32;
      }

      .reflection-card {
        width: min(980px, 100%);
        margin: 0 auto;
        padding: clamp(28px, 5vw, 64px);
      }

      .card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: clamp(22px, 3vw, 34px);
      }

      .pill {
        border: 1px solid rgba(22, 32, 42, 0.18);
        border-radius: 999px;
        padding: 8px 13px;
        background: rgba(255, 255, 255, 0.52);
        color: rgba(22, 32, 42, 0.78);
        font-size: clamp(0.9rem, 1.2vw, 1.1rem);
        font-weight: 800;
      }

      .question {
        margin: 0;
        font-size: clamp(2.2rem, 5.3vw, 5.2rem);
        font-weight: 850;
        line-height: 1.04;
      }

      .prompt {
        margin-top: clamp(22px, 3vw, 34px);
        color: rgba(22, 32, 42, 0.72);
        font-size: clamp(1.15rem, 2vw, 1.75rem);
        line-height: 1.4;
      }

      .notes-panel {
        position: fixed;
        right: clamp(14px, 2vw, 24px);
        bottom: 88px;
        z-index: 20;
        width: min(540px, calc(100vw - 28px));
        max-height: min(58vh, 520px);
        overflow: auto;
        padding: 22px;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(14px);
        transform: translateY(18px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .notes-panel.visible {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      .notes-panel h2 {
        margin-bottom: 12px;
        font-size: 1.2rem;
      }

      .notes-panel dl {
        display: grid;
        gap: 12px;
        margin: 0;
      }

      .notes-panel dt {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 850;
        text-transform: uppercase;
      }

      .notes-panel dd {
        margin: 4px 0 0;
        font-size: 1rem;
        line-height: 1.42;
      }

      .controls {
        display: grid;
        grid-template-columns: auto auto 1fr auto auto auto;
        gap: 10px;
        align-items: center;
        padding: 12px clamp(14px, 2vw, 24px);
        border-top: 1px solid var(--line);
        background: rgba(251, 250, 247, 0.86);
        backdrop-filter: blur(14px);
      }

      .control-button {
        min-width: 44px;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--ink);
        cursor: pointer;
        font-weight: 850;
      }

      .control-button:hover,
      .control-button:focus-visible {
        outline: 3px solid rgba(61, 115, 185, 0.25);
        background: #fff;
      }

      .status {
        justify-self: center;
        color: var(--muted);
        font-size: 0.98rem;
        font-weight: 800;
      }

      .drawer {
        position: fixed;
        inset: auto 16px 76px auto;
        z-index: 25;
        width: min(680px, calc(100vw - 32px));
        max-height: min(64vh, 560px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
        display: none;
      }

      .drawer.visible {
        display: block;
      }

      .thumb-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .thumb {
        min-height: 70px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        text-align: left;
      }

      .thumb.active {
        outline: 3px solid rgba(61, 115, 185, 0.32);
      }

      .thumb span {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 850;
      }

      .thumb strong {
        display: -webkit-box;
        margin-top: 4px;
        overflow: hidden;
        font-size: 0.84rem;
        line-height: 1.16;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      [data-notes].visually-hidden {
        display: none;
      }

      @media (max-width: 900px) {
        body {
          overflow: auto;
        }

        .app {
          min-height: 100%;
        }

        .slide {
          padding-bottom: 110px;
        }

        .color-grid,
        .overview-layout,
        .overview-grid {
          grid-template-columns: 1fr;
        }

        .slide.active {
          align-items: start;
          overflow: auto;
        }

        .reflection-card {
          margin-top: 8px;
        }

        .controls {
          position: fixed;
          right: 0;
          bottom: 0;
          left: 0;
          grid-template-columns: auto auto 1fr auto auto;
        }

        .status {
          font-size: 0.82rem;
        }

        .thumb-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .optional-label {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="slides" id="slides" aria-live="polite"></main>

      <section class="notes-panel" id="notes-panel" aria-label="Präsentationsnotizen">
        <h2>Notizen</h2>
        <div id="notes-content"></div>
      </section>

      <section class="drawer" id="drawer" aria-label="Folienübersicht">
        <div class="thumb-grid" id="thumb-grid"></div>
      </section>

      <footer class="controls" aria-label="Präsentationssteuerung">
        <button class="control-button" type="button" id="prev" aria-label="Vorherige Folie">‹</button>
        <button class="control-button" type="button" id="next" aria-label="Nächste Folie">›</button>
        <div class="status" id="status">Folie 1</div>
        <button class="control-button" type="button" id="notes-toggle" aria-label="Notizen ein- oder ausblenden">Notizen</button>
        <button class="control-button" type="button" id="overview-toggle" aria-label="Folienübersicht ein- oder ausblenden">
          <span class="optional-label">Übersicht</span>
          <span aria-hidden="true">☷</span>
        </button>
        <button class="control-button" type="button" id="home" aria-label="Zur Startfolie">Start</button>
      </footer>
    </div>

                "Welche Absprache hat euch geholfen?"
              ]
            },
            {
              title: "Zukunft",
              question: "Was nehme ich mit?",
              category: "reflexion",
              goal: "Eine persönliche Konsequenz für zukünftige Situationen formulieren.",
              followUps: [
                "Was willst du dir merken?",
                "Was soll beim nächsten Konflikt anders laufen?",
                "Welche Stärke kannst du nutzen?"
              ]
            },
            {
              title: "Wichtigste Botschaft",
              question: "Was sollen die Fünftklässler mitnehmen?",
              category: "praesentation",
              goal: "Die wichtigste Aussage für die Zielgruppe priorisieren.",
              followUps: [
                "Was ist wichtiger als Details des Streits?",
                "Welche Botschaft hilft wirklich im Alltag?",
                "Wie klingt die Botschaft in einem Satz?"
              ]
            },
            {
              title: "Unser Tipp",
              question: "Welchen Rat würden wir geben?",
              category: "praesentation",
              goal: "Einen konkreten, anwendbaren Rat für jüngere Schülerinnen und Schüler formulieren.",
              followUps: [
                "Was kann man sofort ausprobieren?",
                "Was klingt glaubwürdig von euch?",
                "Welcher Tipp ist kurz genug zum Merken?"
              ]
            },
            {
              title: "Stark sein",
              question: "Was bedeutet echte Stärke?",
              category: "praesentation",
              goal: "Stärke als Selbstkontrolle, Mut zur Klärung und Verantwortung deuten.",
              followUps: [
                "Ist Zurückschlagen stark?",
                "Wann braucht Entschuldigen Mut?",
                "Wie sieht Stärke ohne Gewalt aus?"
              ]
            },
            {
              title: "Unser Ziel",
              question: "Was möchten wir erreichen?",
              category: "ziel",
              goal: "Den Abschluss des Reflexionstermins auf ein gemeinsames Ziel ausrichten.",
              followUps: [
                "Was soll nach eurer Präsentation anders sein?",
                "Was wollt ihr selbst zeigen?",
                "Woran merkt ihr, dass das Ziel erreicht wurde?"
              ]
            }
          ]
        }
      ];

      const slides = [
        {
          type: "title",
          label: "Start",
          title: "Vergangenheit, Gegenwart, Zukunft",
          notes: {
            goal:
              "Ruhiger Einstieg in das Gespräch und Klärung: Es geht um Reflexion, Botschaften und nächste Schritte.",
            followUps: [
              "Womit möchten wir heute beginnen?",
              "Welche Karte könnte heute besonders hilfreich sein?"
            ],
            support: "Orientierung",
            hint: impulseHint
          }
        },
        {
          type: "colors",
          label: "Farblogik",
          title: "Farblogik",
          notes: {
            goal:
              "Die Farbcodes erklären, damit Lehrkraft und Lernende die Karten schnell einordnen können.",
            followUps: [
              "Welche Farbe brauchen wir gerade im Gespräch?",
              "Geht es eher ums Verstehen, um die Botschaft oder um eine Absprache?"
            ],
            support: "Moderationsstruktur",
            hint: impulseHint
          }
        }
      ];

      terms.forEach((term) => {
        slides.push({
          type: "term-overview",
          label: term.title,
          term,
          title: term.title,
          notes: {
            goal:
              "Alle Karten dieses Termins sichtbar machen und gemeinsam auswählen, welche Impulse heute passen.",
            followUps: [
              "Welche Karte ist für euch gerade am wichtigsten?",
              "Welche Karte können wir überspringen?",
              "Welche Reihenfolge hilft euch im Gespräch?"
            ],
            support: "Überblick und Gesprächssteuerung",
            hint: impulseHint
          }
        });

        term.cards.forEach((card) => {
          slides.push({
            type: "card",
            label: card.title,
            term,
            card,
            notes: {
              goal: card.goal,
              followUps: card.followUps,
              support: categoryInfo[card.category].support,
              hint: impulseHint
            }
          });
        });
      });

      const slidesEl = document.getElementById("slides");
      const statusEl = document.getElementById("status");
      const notesPanel = document.getElementById("notes-panel");
      const notesContent = document.getElementById("notes-content");
      const drawer = document.getElementById("drawer");
      const thumbGrid = document.getElementById("thumb-grid");
      let current = 0;

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function renderNotes(notes) {
        return `
          <dl>
            <div>
              <dt>Ziel</dt>
              <dd>${escapeHtml(notes.goal)}</dd>
            </div>
            <div>
              <dt>Mögliche Nachfragen</dt>
              <dd>${notes.followUps.map(escapeHtml).join("<br>")}</dd>
            </div>
            <div>
              <dt>Unterstützt</dt>
              <dd>${escapeHtml(notes.support)}</dd>
            </div>
            <div>
              <dt>Moderationshinweis</dt>
              <dd>${escapeHtml(notes.hint)}</dd>
            </div>
          </dl>
        `;
      }

      function renderSlide(slide, index) {
        const id = `folie-${index + 1}`;
        if (slide.type === "title") {
          return `
            <section class="slide center" id="${id}" aria-label="${escapeHtml(slide.label)}">
              <div class="slide-inner">
                <p class="eyebrow">Digitales Kartenset für Jahrgang 6</p>
                <h1>${escapeHtml(slide.title)}</h1>
              </div>
              <aside class="visually-hidden" data-notes>${renderNotes(slide.notes)}</aside>
            </section>
          `;
        }

        if (slide.type === "colors") {
          return `
            <section class="slide" id="${id}" aria-label="${escapeHtml(slide.label)}">
              <div class="slide-inner">
                <p class="eyebrow">Orientierung</p>
                <h2>${escapeHtml(slide.title)}</h2>
                <div class="color-grid">
                  <article class="color-card blue">
                    <strong>Blau = Reflexion</strong>
                    <span>Erinnern, verstehen, Gefühle und Folgen einordnen.</span>
                  </article>
                  <article class="color-card yellow">
                    <strong>Gelb = Präsentation/Botschaften</strong>
                    <span>Gemeinsame Aussagen und Tipps für Fünftklässler vorbereiten.</span>
                  </article>
                  <article class="color-card green">
                    <strong>Grün = Zusammenarbeit/Zielvereinbarung</strong>
                    <span>Aufgaben klären, Absprachen treffen und nächste Schritte sichern.</span>
                  </article>
                </div>
              </div>
              <aside class="visually-hidden" data-notes>${renderNotes(slide.notes)}</aside>
            </section>
          `;
        }

        if (slide.type === "term-overview") {
          return `
            <section class="slide" id="${id}" aria-label="${escapeHtml(slide.label)}">
              <div class="slide-inner">
                <p class="eyebrow">${escapeHtml(slide.term.focus)}</p>
                <h2>${escapeHtml(slide.title)}</h2>
                <div class="overview-layout">
                  <aside class="overview-note">
                    <small>Moderation</small>
                    <p>Diese Übersicht ist eine Auswahlhilfe. Nicht alle Karten müssen besprochen werden; die Lehrkraft kann gemeinsam mit den beiden Lernenden passende Impulse auswählen.</p>
                  </aside>
                  <div class="overview-grid">
                    ${slide.term.cards
                      .map((card) => {
                        const info = categoryInfo[card.category];
                        return `
                          <article class="mini-card ${info.className}">
                            <small>${escapeHtml(info.shortLabel)}</small>
                            <strong>${escapeHtml(card.title)}: ${escapeHtml(card.question)}</strong>
                          </article>
                        `;
                      })
                      .join("")}
                  </div>
                </div>
              </div>
              <aside class="visually-hidden" data-notes>${renderNotes(slide.notes)}</aside>
            </section>
          `;
        }

        const info = categoryInfo[slide.card.category];
        return `
          <section class="slide" id="${id}" aria-label="${escapeHtml(slide.card.title)}">
            <div class="slide-inner">
              <article class="reflection-card ${info.className}">
                <div class="card-meta">
                  <span class="pill">${escapeHtml(slide.term.title)}</span>
                  <span class="pill">${escapeHtml(info.label)}</span>
                </div>
                <small>${escapeHtml(slide.card.title)}</small>
                <p class="question">${escapeHtml(slide.card.question)}</p>
              </article>
            </div>
            <aside class="visually-hidden" data-notes>${renderNotes(slide.notes)}</aside>
          </section>
        `;
      }

      slidesEl.innerHTML = slides.map(renderSlide).join("");
      const slideNodes = Array.from(document.querySelectorAll(".slide"));

      thumbGrid.innerHTML = slides
        .map(
          (slide, index) => `
            <button class="thumb" type="button" data-thumb="${index}">
              <span>${index + 1}</span>
              <strong>${escapeHtml(slide.type === "card" ? slide.card.title : slide.label)}</strong>
            </button>
          `
        )
        .join("");
      const thumbs = Array.from(document.querySelectorAll(".thumb"));

      function showSlide(index) {
        current = Math.max(0, Math.min(slides.length - 1, index));
        slideNodes.forEach((slide, slideIndex) => {
          slide.classList.toggle("active", slideIndex === current);
        });
        thumbs.forEach((thumb, thumbIndex) => {
          thumb.classList.toggle("active", thumbIndex === current);
        });

        const active = slideNodes[current];
        const note = active.querySelector("[data-notes]");
        notesContent.innerHTML = note ? note.innerHTML : "";
        statusEl.textContent = `Folie ${current + 1} / ${slides.length}`;
        history.replaceState(null, "", `#folie-${current + 1}`);
      }

      function toggleNotes() {
        notesPanel.classList.toggle("visible");
      }

      function toggleDrawer() {
        drawer.classList.toggle("visible");
      }

      document.getElementById("prev").addEventListener("click", () => showSlide(current - 1));
      document.getElementById("next").addEventListener("click", () => showSlide(current + 1));
      document.getElementById("home").addEventListener("click", () => showSlide(0));
      document.getElementById("notes-toggle").addEventListener("click", toggleNotes);
      document.getElementById("overview-toggle").addEventListener("click", toggleDrawer);
      thumbGrid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-thumb]");
        if (!button) return;
        showSlide(Number(button.dataset.thumb));
        drawer.classList.remove("visible");
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
          event.preventDefault();
          showSlide(current + 1);
        }
        if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          showSlide(current - 1);
        }
        if (event.key === "Home") {
          event.preventDefault();
          showSlide(0);
        }
        if (event.key === "End") {
          event.preventDefault();
          showSlide(slides.length - 1);
        }
        if (event.key.toLowerCase() === "n") {
          toggleNotes();
        }
        if (event.key.toLowerCase() === "o") {
          toggleDrawer();
        }
        if (event.key === "Escape") {
          notesPanel.classList.remove("visible");
          drawer.classList.remove("visible");
        }
      });

      const initialMatch = window.location.hash.match(/folie-(\d+)/);
      const initialIndex = initialMatch ? Number(initialMatch[1]) - 1 : 0;
      showSlide(initialIndex);
    </script>
  </body>
</html>
